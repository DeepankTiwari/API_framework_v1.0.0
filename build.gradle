plugins {
    id 'java'
    id 'io.qameta.allure' version '4.1.0'
}

group = 'com.deepank.api'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.testng:testng:7.11.0'
    implementation 'io.rest-assured:rest-assured:5.5.6'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'

    // Logging
    implementation 'ch.qos.logback:logback-classic:1.5.12'

    // Reporting
    testImplementation 'io.qameta.allure:allure-testng:2.29.1'
    testImplementation 'io.qameta.allure:allure-rest-assured:2.29.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
}

test {
    useTestNG() {
        suites 'src/test/resources/testng.xml'

        def groups = System.getProperty("groups")
        if (groups != null) {
            includeGroups groups.split(",")
        }
    }

    testLogging {
        showStandardStreams = true
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
