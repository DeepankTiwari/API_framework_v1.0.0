plugins {
    id 'java'
    id 'io.qameta.allure' version '4.1.0'
}

group = 'com.deepank.api'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.testng:testng:7.11.0'
    implementation 'org.testng:testng:7.11.0'
    implementation 'io.rest-assured:rest-assured:5.5.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    implementation 'ch.qos.logback:logback-classic:1.6.0'
    implementation 'io.rest-assured:json-schema-validator:5.5.6'
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

    implementation 'io.qameta.allure:allure-testng:2.35.0'
}

test {
    useTestNG() {
        suites 'src/test/resources/testng.xml'

        def groups = System.getProperty("groups")
        if(groups != null){
            includeGroups groups.split(",")
        }
    }

    testLogging {
        showStandardStreams = true
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

allure {
    version = "2.42.1"
}